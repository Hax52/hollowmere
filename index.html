/* ---------- panels: one open at a time, opening one from another returns to it ---------- */
let panelStack = [];
const topPanel = () => [...document.querySelectorAll('.panel')].find(p => !p.hidden) || null;
function openPanel(id, render){
  const cur = topPanel(), p = $('#' + id);
  if (cur && cur.id === id){ if (render) render(); return; }
  const a = document.activeElement;
  panelStack.push({from:cur ? cur.id : null, opener:a && a.id ? a.id : null});
  if (cur) cur.hidden = true;
  if (render) render();
  p.hidden = false; p.scrollTop = 0;
  if (S && S.screen === 'play') renderHud();
  const f = p.querySelector('.sh-head button'); if (f) f.focus({preventScroll:true});
}
function closePanel(id){
  const p = $('#' + id); if (!p || p.hidden) return;
  p.hidden = true;
  const top = panelStack.pop() || {};
  if (top.from){ const q = $('#' + top.from); if (q){ if (top.from === 'sheet') renderSheet(); q.hidden = false; } }
  if (S && S.screen === 'play') renderHud();
  if (S && S.screen === 'create' && !top.from) rerenderCreate();
  const o = top.opener && document.getElementById(top.opener);
  const fb = $('#sheet-btn') || $('#new-tale') || $('#next') || $('#begin');
  const tgt = o && o.offsetParent !== null ? o : fb;
  if (tgt) tgt.focus({preventScroll:true});
}

function getPath(obj, path){ return path.split('.').reduce((o, k) => o == null ? o : o[k], obj); }

  const ks = path.split('.'); let o = obj;

  o[ks[ks.length - 1]] = val;

const pbFromPrio = K => { const o = {}; K.prio.forEach((a, i) => o[a] = STD[i]); return o; };
const rollStats = () => Array.from({length:6}, () => { const r = [d(6), d(6), d(6), d(6)].sort((x, y) => x - y); return r[1] + r[2] + r[3]; });
const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function onDraftChange(path){
  const dr = S.draft; if (!dr) return;
  if (path === 'cls'){
    const K = callingOf(dr);
    dr.skills = K.skills.slice(); dr.expertise = (K.expertise || []).slice();
    if (dr.method === 'pointbuy') dr.pb = pbFromPrio(K); else arrange(dr);
  }
  if ((path === 'plus2' || path === 'plus1') && dr.plus2 === dr.plus1){ const o = path === 'plus2' ? 'plus1' : 'plus2'; dr[o] = dr[path] === 'CON' ? 'DEX' : 'CON'; }
  if (path === 'custom.weapon'){ const W = WEAPONS[dr.custom.weapon]; if (W && W.heavy) dr.custom.shield = false; }
  if ((path === 'custom.weapon' || path === 'custom.features') && dr.method !== 'pointbuy') arrange(dr);
  if (path === 'method'){
    if (dr.method === 'roll' && !dr.rolled) dr.rolled = rollStats();
    if (dr.method === 'pointbuy') dr.pb = pbFromPrio(callingOf(dr)); else arrange(dr);
  }
  const K = callingOf(dr), lock = lockedSkills(dr);
  dr.skills = [...new Set(dr.skills || [])].filter(k => K.skillFrom.includes(k) && !lock.includes(k)).slice(0, K.skillPick);
  dr.expertise = K.features.includes('expertise') ? (dr.expertise || []).filter(k => dr.skills.includes(k) || lock.includes(k)).slice(0, 2) : [];
  dr.kit = (dr.kit || []).filter(k => KIT[k]).slice(0, 2);
}

      return '';

      if (n < 2) return `Choose ${pl(2 - n, 'more gift')} for your calling.`;

    case 'abilities': return dr.method === 'pointbuy' && pbSpent(dr.pb) > PB_BUDGET ? 'You’ve spent more than 27 points.' : '';
    case 'skills': {
      const need = skillNeed(dr, K), n = dr.skills.length;

  return '';
}

      <fieldset class="form-sec"><legend class="lbl">How to set them</legend><div class="segs">

    case 'skills': {
      const lock = lockedSkills(dr), need = skillNeed(dr, K), xp = K.features.includes('expertise');
      const from = k => (peopleSkills(dr).includes(k) ? 'From your people' : 'From your past');
      const bonus = k => { const a = SKILLS[k][0]; return mod(finalScores(dr)[a]); };
      const row = k => {
        const locked = lock.includes(k), on = locked || dr.skills.includes(k), x = dr.expertise.includes(k);

      <fieldset class="form-sec"><legend class="lbl lg">${esc(K.name)} skills ${countTag(dr.skills.length, need)}</legend>

        ${Object.entries(KIT).map(([k, I]) => checkOpt('kit', k, dr.kit, 2, I.name, I.text)).join('')}
      </div></fieldset>

        <span><b>Body</b>HP ${pc.maxHp} · AC ${pc.ac} · ${ABIL.map(a => `${a} ${pc.abil[a]}`).join(' ')}</span>

        <span><b>Gifts</b>${pc.features.map(f => FEATURES[f].name).join(', ') || 'none'}</span>
        <span><b>Skills</b>${pc.skills.map(k => SKILLS[k][1] + (pc.expertise.includes(k) ? ' ✦' : '')).join(', ')}</span>
        <span><b>Past</b>${esc((ORIGINS[pc.origin] || {}).name || '')}${pc.backstory ? `: ${esc(pc.backstory)}` : ''} · ${esc(pc.keepsake)}</span>
      </div>`;
    }
  }
  return '';
}
function customCallingHTML(dr){

  const asub = A => `AC ${A.base}${A.dex >= 9 ? ' + DEX' : A.dex > 0 ? ` + DEX (max ${A.dex})` : ''}${A.heavy ? ' · loud' : ''}`;
  return `
    <div class="form-sec"><label class="lbl" for="cc-name">Name your calling</label><input class="tin" id="cc-name" maxlength="24" autocomplete="off" data-field="custom.name" value="${esc(c.name)}" placeholder="Bog Knight, Lamplighter, Exorcist…"></div>

      ${Object.entries(FEATURES).map(([k, F]) => {

function previewLine(dr){
  const pc = buildPC(dr), W = WEAPONS[pc.weapon], m = mod(pc.abil[W.abil]);
  const duel = pc.features.includes('duelist') && !W.ranged && !W.heavy ? 2 : 0;
  return `HP ${pc.maxHp} · AC ${pc.ac} · ${W.name} ${fmt(m + 2)} to hit, ${W.dice}${m + duel ? fmt(m + duel) : ''}${pc.caster ? ` · spell DC ${8 + 2 + mod(pc.abil[pc.caster])}` : ''}`;

function rerenderCreate(){
  if (!S || S.screen !== 'create') return;
  const sc = $('#scroll'), top = sc.scrollTop, a = document.activeElement, id = a && a.id;
  renderPage(); renderTray();
  sc.scrollTop = top;
  if (id){ const el = document.getElementById(id); if (el && el !== document.activeElement) el.focus({preventScroll:true}); }
}
function gotoStep(id){
  const dr = S.draft; if (!dr) return;
  dr.step = id; trayMsg = '';
  renderPage(); renderTray();
  $('#scroll').scrollTop = 0;
}
function createTray(t){
  const dr = S.draft, st = allSteps(), idx = Math.max(0, st.findIndex(s => s.id === dr.step)), last = idx === st.length - 1;
  if (busy){ t.innerHTML = HOOKS.trayBusy() || '<p class="note" style="margin:0">One moment…</p>'; return; }
  dr.seen = dr.seen || {};
  const chips = st.map((s, i) => {
    const issue = stepIssue(s.id, dr), seen = dr.seen[s.id] || dr.tried;
    const bad = issue && seen, done = seen && !issue;
    return `<button class="step${done ? ' done' : ''}${bad ? ' bad' : ''}" id="step-${s.id}" data-act="step" data-step="${s.id}"${i === idx ? ' aria-current="step"' : ''}><span class="tick" aria-hidden="true">${bad ? '!' : done ? '✓' : i + 1}</span>${esc(s.label)}<span class="sr">${bad ? ': needs attention' : done ? ': done' : ''}</span></button>`;
  }).join('');
  t.innerHTML = `<nav class="steps" aria-label="Character checklist">${chips}</nav>
    ${trayMsg ? `<p class="tray-msg" role="alert">${esc(trayMsg)}</p>` : ''}
    <div class="nav-row">${idx > 0 ? '<button class="big-btn back" id="back" data-act="back">Back</button>' : ''}${last
      ? '<button class="big-btn primary" id="begin" data-act="begin">Seal it and begin</button>'
      : `<button class="big-btn primary" id="next" data-act="next">Next: ${esc(st[idx + 1].label)}</button>`}</div>
    ${last ? '' : '<p class="title-links"><button class="link" id="skip-begin" data-act="begin">Begin now with these choices</button></p>'}`;
  const cur = t.querySelector('[aria-current="step"]');
  if (cur){ const nav = t.querySelector('.steps'); nav.scrollLeft = Math.max(0, cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2); }
}

/* ---------- the lower roller ---------- */
function renderTray(){
  const t = $('#tray');
  if (S.screen === 'title'){
    const saved = loadSave();
    const can = saved && saved.screen === 'play' && saved.pc && !saved.ended;
    if (confirmNew){
      t.innerHTML = `<div class="stack"><p class="confirm-q">Starting over erases the tale of ${esc(saved.pc.name)}. Begin anyway?</p>
        <button class="big-btn primary" id="confirm-new" data-act="confirmnew">Erase it and begin anew</button>
        <button class="big-btn" id="cancel-new" data-act="cancelnew">Keep that tale</button></div>`;
    } else {
      t.innerHTML = `<div class="stack">
        ${can ? `<button class="big-btn primary" id="continue" data-act="continue">Continue the tale of ${esc(saved.pc.name)}</button>` : ''}
        <button class="big-btn${can ? '' : ' primary'}" id="new-tale" data-act="new">Begin a new tale</button>
        <p class="title-links"><button class="link" id="look-open-title" data-act="lookopen">Appearance</button> <span aria-hidden="true">·</span> <button class="link" id="voice-open-title" data-act="voiceopen">Narrator</button> <span aria-hidden="true">·</span> <button class="link" id="faces-open-title" data-act="facesopen">Portraits</button>${HOOKS.titleLinks()}</p></div>`;
    }
    return;
  }
  if (S.screen === 'create') return createTray(t);
  const hb = HOOKS.trayBusy(); if (hb){ t.innerHTML = hb; return; }
  const ov = HOOKS.trayOverride(); if (ov != null){ t.innerHTML = ov; return; }
  if (S.combat) return renderCombatTray(t);
  t.classList.remove('fighting');
  if (S.pending){
    const p = S.pending, ch = p.check, b = checkBonus(ch), f = p.failed, mode = modeOf(ch);
    t.innerHTML = `<div class="rollpad">
      <button class="bigdie" id="bigdie" data-act="roll" aria-label="Roll the d20"${f ? ' disabled' : ''}>${dieSVG(f ? f.nat : '20', f && f.nat === 1 ? 'fum' : '')}</button>
      <div class="rp-info">
        <p class="rp-label">${esc(rollLabel(ch))}</p>
        <p class="rp-math">d20 <b>${fmt(b)}</b>${mode === 'adv' ? ' with advantage' : mode === 'dis' ? ' with disadvantage' : ''} · need <b>${ch.dc}</b></p>
        <p class="rp-hint${f ? ' no' : ''}" id="rp-hint" aria-live="polite">${f ? `${f.total} — Failure` : p.rerolled ? 'Tap the die to roll again' : 'Tap the die to roll'}</p>
      </div></div>${f ? `<div class="keep-offer">
        <button class="big-btn primary" id="keep-yes" data-act="keepyes">Hold ${esc(keepsakeText())} and roll again</button>
        <button class="big-btn" id="keep-no" data-act="keepno">Accept the failure</button>
        <p class="note">Your keepsake can do this once between rests.</p></div>` : ''}`;
    return;
  }
  if (S.ended){
    t.innerHTML = `<div class="stack"><button class="big-btn primary" id="again" data-act="again">Begin a new tale</button>
      <button class="big-btn" id="reread" data-act="reread">Read the scroll from the top</button></div>`;
    return;
  }
  const list = choicesFor(NODES[S.node]);
  t.innerHTML = (trayMsg ? `<p class="tray-msg" role="alert">${esc(trayMsg)} ${HOOKS.msgLink()}</p>` : '') + `<div class="choices">${list.map((c, i) => {
    const afford = !c.cost || S.pc.gold >= c.cost;
    let meta = '';
    if (c.check){ const mo = modeOf(c.check); meta += `${checkLabel(c.check)} <b>${fmt(checkBonus(c.check))}</b> · DC ${c.check.dc}${mo === 'adv' ? ' · advantage' : mo === 'dis' ? ' · disadvantage' : ''}`; }
    if (c.cost) meta += `${meta ? ' · ' : ''}<span class="cost">${c.cost} gold${afford ? '' : ' (you have ' + S.pc.gold + ')'}</span>`;
    return `<button class="choice" id="choice-${i}" data-act="choose" data-i="${i}"${afford && !busy ? '' : ' disabled'}><span>${esc(choiceLabel(c, i))}</span>${meta ? `<span class="ck">${meta}</span>` : ''}</button>`;
  }).join('')}</div>` + HOOKS.trayExtra();
}

      </div>
      <div class="sh-sec"><h3>Gifts</h3><ul class="feat">${feats.join('') || '<li class="muted">None.</li>'}</ul></div>
      <div class="sh-sec"><h3>Arms and pack</h3><ul class="feat">
        <li><b>${W.name}</b> ${fmt(w.toHit)} to hit, ${W.dice}${w.dmgB ? fmt(w.dmgB) : ''} ${W.type}${W.thrown ? ', can be thrown' : ''}${W.ranged ? ', ranged' : ''}</li>
        <li><b>${ARMOR[pc.armor].name}${pc.shield ? ' and shield' : ''}</b> AC ${pc.ac}${ARMOR[pc.armor].heavy ? ', noisy: disadvantage on Stealth' : ''}</li>
        <li><b>Healing draughts</b> ${pc.potions} · heal 2d4+2, bonus action</li>
        ${pc.holy ? `<li><b>Holy water</b> ${pc.holy} · 2d6+2 radiant to undead</li>` : ''}
        ${kit}
        <li><b>Gold</b> ${pc.gold}</li>
      </ul></div>
      ${pastSheetHTML()}${HOOKS.sheetSections()}
      ${best ? `<div class="sh-sec"><h3>Bestiary</h3><ul class="feat bestiary">${best}</ul></div>` : ''}
      <div class="sh-sec"><h3>Lore</h3>${S.lore.length ? `<ol class="lore-list">${S.lore.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p class="muted">Nothing learned yet. Ask questions; read what you find.</p>'}</div>
      <div class="sh-sec"><h3>Saving throws</h3><ul class="sk">${saves}</ul></div>
      <div class="sh-sec"><h3>Skills</h3><ul class="sk">${skills}</ul><p class="note">Bold: trained. ✦ expertise (double proficiency).</p></div>
      <div class="sh-sec"><h3>Settings</h3><div class="ab-tools" style="margin-top:0"><button class="small-btn" id="sh-look" data-act="lookopen">Appearance</button><button class="small-btn" id="sh-voice" data-act="voiceopen">Narrator</button><button class="small-btn" id="sh-faces" data-act="facesopen">Portraits</button>${HOOKS.sheetButtons()}</div></div>
      <div class="sh-sec" id="sh-danger">${sheetDanger()}</div>
    </div>`;
}
function pastSheetHTML(){
  const pc = S.pc, O = ORIGINS[pc.origin];
  let line = '';
  if (O && pc.origin === 'custom') line = `<li><b>${O.name}.</b> ${pc.backstory ? `Before this, you were ${esc(pc.backstory)}.` : ''}</li>`;
  else if (O) line = `<li><b>${O.name}.</b> ${O.perk}</li>`;
  return `<div class="sh-sec"><h3>Your past</h3><ul class="feat">${line}
    <li><b>Keepsake.</b> ${esc(cap(keepsakeText()))}. When a check fails, hold it close and roll again: ${pc.keep} of ${pc.maxKeep || 1} left until you rest.</li></ul></div>`;
}
function sheetDanger(){
  return confirmNew
    ? `<p class="confirm-q">Start over? This erases the current tale.</p><div class="ab-tools"><button class="small-btn" id="sh-yes" data-act="sheetnewyes">Erase and start over</button><button class="small-btn" id="sh-no" data-act="sheetnewno">Keep playing</button></div>`
    : `<button class="small-btn" id="sh-new" data-act="sheetnew">Start a new tale</button>`;
}

/* ================= flow ================= */
function renderAll(){ renderHud(); renderPage(); renderTray(); }
function toTitle(){ Voice.cancel(); S = Object.assign(newState(), {screen:'title'}); confirmNew = false; trayMsg = ''; renderAll(); }
function startCreate(){ Voice.cancel(); S = newState(); S.screen = 'create'; confirmNew = false; trayMsg = ''; renderAll(); $('#scroll').scrollTop = 0; }
async function beginTale(){
  const dr = S.draft;
  if (!dr || busy) return;
  const bad = allSteps().map(s => ({s, issue:stepIssue(s.id, dr)})).find(x => x.issue);
  if (bad){ dr.tried = true; gotoStep(bad.s.id); trayMsg = bad.issue; renderTray(); return; }
  trayMsg = '';
  busy = true; renderTray();
  let ok = true;
  try { ok = await HOOKS.beforeBegin(dr); } catch (e) { ok = true; }
  busy = false;
  if (S.draft !== dr) return;
  if (ok === false){ renderTray(); return; }
  S.pc = buildPC(dr);
  S.world = cleanWorld(dr);
  S.screen = 'play'; S.draft = null;
  renderPage(); renderHud();
  $('#scroll').scrollTop = 0;
  go('start');
}
function resume(saved){
  Voice.cancel();
  S = saved; busy = false; confirmNew = false; trayMsg = '';
  upgradeSave(S);
  HOOKS.resume();
  renderAll();
  const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight;
  if (S.combat && S.combat.phase === 'enemy') enemyPhase();
}
function nextStep(dir){
  const dr = S.draft, st = allSteps(), i = st.findIndex(s => s.id === dr.step);
  if (dir > 0){
    const issue = stepIssue(dr.step, dr);
    if (issue){ trayMsg = issue; renderTray(); return; }
  }
  const j = Math.max(0, Math.min(st.length - 1, i + dir));
  gotoStep(st[j].id);
  const f = $(dir > 0 ? '#next' : '#back') || $('#begin') || $('#next'); if (f) f.focus({preventScroll:true});
}
function toggleList(path, val, max, on){
  const tgt = fieldTarget(); if (!tgt) return;
  const list = (getPath(tgt, path) || []).slice();
  const i = list.indexOf(val);
  if (on && i < 0 && list.length < max) list.push(val);
  if (!on && i >= 0) list.splice(i, 1);
  setPath(tgt, path, list);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el){ Voice.tapRead(ev); return; }
  if (el.disabled) return;
  Voice.unlock();
  const a = el.dataset.act, cb = S && S.combat;
  switch (a){
    case 'new': { const sv = loadSave(); if (sv && sv.screen === 'play' && sv.pc && !sv.ended){ confirmNew = true; renderTray(); } else startCreate(); break; }
    case 'confirmnew': clearSave(); startCreate(); break;
    case 'cancelnew': confirmNew = false; renderTray(); break;
    case 'continue': { const sv = loadSave(); if (sv) resume(sv); break; }
    case 'begin': beginTale(); break;
    case 'next': nextStep(1); break;
    case 'back': nextStep(-1); break;
    case 'step': gotoStep(el.dataset.step); { const s = $('#step-' + el.dataset.step); if (s) s.focus({preventScroll:true}); } break;
    case 'swap': {
      const dr = S.draft, k = el.dataset.a;
      if (!dr || dr.method === 'pointbuy') break;
      if (!dr.arr) arrange(dr);
      if (!dr.sel || dr.sel === k) dr.sel = dr.sel === k ? null : k;
      else { const t = dr.arr[k]; dr.arr[k] = dr.arr[dr.sel]; dr.arr[dr.sel] = t; dr.sel = null; }
      rerenderCreate(); break;
    }
    case 'pb': {
      const dr = S.draft, k = el.dataset.a, v = dr.pb[k] + (+el.dataset.d);
      if (v < 8 || v > 15) break;
      const next = Object.assign({}, dr.pb, {[k]:v});
      if (pbSpent(next) > PB_BUDGET) break;
      dr.pb = next; rerenderCreate(); break;
    }
    case 'rollstats': S.draft.rolled = rollStats(); S.draft.method = 'roll'; arrange(S.draft); rerenderCreate(); break;
    case 'arrange': { const dr = S.draft; if (dr.method === 'pointbuy') dr.pb = pbFromPrio(callingOf(dr)); else arrange(dr); rerenderCreate(); break; }
    case 'xp': {
      ev.preventDefault();
      const dr = S.draft, k = el.dataset.k, i = dr.expertise.indexOf(k);
      if (i >= 0) dr.expertise.splice(i, 1); else if (dr.expertise.length < 2) dr.expertise.push(k);
      rerenderCreate(); break;
    }
    case 'chip': fillChip(el); break;
    case 'choose': choose(+el.dataset.i); break;
    case 'roll': doCheckRoll(); break;
    case 'death': deathSave(); break;
    case 'keepyes': keepsakeReroll(); break;
    case 'keepno': acceptFailure(); break;
    case 'act': act(el.dataset.id, el.dataset.opt); break;
    case 'target': if (cb && !busy){ const i = +el.dataset.i; if (alive(cb.enemies[i])){ cb.target = i; if (cb.sub) cb.sub = null; renderTray(); const f = $('#foe-' + i); if (f) f.focus({preventScroll:true}); } } break;
    case 'ctab': if (cb){ cb.tab = el.dataset.tab; cb.sub = null; save(); renderTray(); const f = $('#ctab-' + cb.tab); if (f) f.focus({preventScroll:true}); } break;
    case 'subback': if (cb){ cb.sub = null; renderTray(); const f = $('#ctab-' + cb.tab); if (f) f.focus({preventScroll:true}); } break;
    case 'endturn': if (cb && !busy) endTurn(); break;
    case 'sheet': $('#sheet').hidden ? openSheet() : closeSheet(); break;
    case 'sheetclose': closeSheet(); break;
    case 'sheetnew': confirmNew = true; $('#sh-danger').innerHTML = sheetDanger(); { const y = $('#sh-no'); if (y) y.focus(); } break;
    case 'sheetnewno': confirmNew = false; $('#sh-danger').innerHTML = sheetDanger(); { const n = $('#sh-new'); if (n) n.focus(); } break;
    case 'sheetnewyes': clearSave(); panelStack = []; document.querySelectorAll('.panel').forEach(p => p.hidden = true); startCreate(); break;
    case 'again': clearSave(); startCreate(); break;
    case 'reread': $('#scroll').scrollTo({top:0, behavior: RM ? 'auto' : 'smooth'}); break;
    case 'lookopen': openLook(); break;
    case 'lookclose': closeLook(); break;
    case 'lookreset': LOOK = sanitizeLook({}); saveLook(); applyLook(); renderLook(); { const r = $('#look-reset'); if (r) r.focus(); } break;
    case 'facesopen': openFaces(el.dataset.id); break;
    case 'facesclose': closePanel('faces'); break;
    case 'faces': openFaces(el.dataset.id); break;
    case 'faceup': { faceFor = el.dataset.id; const f = $('#face-file'); f.value = ''; f.click(); break; }
    case 'faceclear': setFace(el.dataset.id, null); { const b = $('#face-up-' + el.dataset.id); if (b) b.focus({preventScroll:true}); } break;
    case 'voiceopen': Voice.open(); break;
    case 'voiceclose': closePanel('voice'); break;
    case 'voicetoggle': Voice.toggle(); { const b = $('#hud-voice'); if (b) b.focus({preventScroll:true}); } break;
    case 'voicetest': Voice.sample(); break;
    default: HOOKS.click(a, el, ev);
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.voice && el.type === 'range'){
    const v = $('#' + el.id + '-v'); if (v) v.textContent = el.dataset.voice === 'rate' ? (+el.value).toFixed(2) + '×' : (+el.value).toFixed(2);
    Voice.set(el.dataset.voice, el.value);
    return;
  }
  const f = el.dataset && el.dataset.field, tgt = fieldTarget();
  if (f && tgt && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT'){
    setPath(tgt, f, el.value);
    if (S && S.screen === 'create' && !busy) renderTray();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, ds = el.dataset || {};
  if (el.id === 'face-file'){ faceFromFile(el.files && el.files[0]); return; }
  if (el.id === 'faces-all'){ faceAll = el.checked; renderFaces(); const c = $('#faces-all'); if (c) c.focus(); return; }
  if (ds.look){ setLook(ds.look, el.type === 'checkbox' ? el.checked : el.value); return; }
  if (ds.voice){
    if (el.type === 'range') return;
    Voice.set(ds.voice, el.type === 'checkbox' ? el.checked : el.value);
    const id = el.id; Voice.renderPanel(); const r = id && document.getElementById(id); if (r) r.focus({preventScroll:true});
    return;
  }
  const tgt = fieldTarget();
  if (tgt && ds.list){ toggleList(ds.list, ds.val, +ds.max || 99, el.checked); if (S.draft === tgt){ onDraftChange(ds.list); rerenderCreate(); } }
  else if (tgt && ds.field && (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT')){
    const v = el.type === 'checkbox' ? el.checked : ds.num ? +el.value : el.value;
    setPath(tgt, ds.field, v);
    if (S.draft === tgt){ onDraftChange(ds.field); rerenderCreate(); }
  }
  HOOKS.change(ev);
});
document.addEventListener('submit', ev => { ev.preventDefault(); HOOKS.submit(ev.target.id); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (HOOKS.escape()) return;
  const p = topPanel();
  if (p){ if (p.id === 'sheet') closeSheet(); else closePanel(p.id); }
  else if (S && S.combat && S.combat.sub){ S.combat.sub = null; renderTray(); }
});

applyLook(); watchTone(); Voice.init();

function start(data){
  if (data && data.S && data.S.v === 1){ resume(data.S); return; }
  toTitle();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot){ try { window.claude.hot.snapshot(() => ({S})); } catch (e) {} }
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});

window.__hollowmere = {NODES, ENEMIES, FIELDS, get state(){ return S; }, get busy(){ return busy; },
  actions:() => S && S.combat ? heroActions().map(a => ({id:a.id, tab:a.tab, kind:a.kind, on:a.on, label:a.label, menu:a.menu ? a.menu.map(o => o.id) : null})) : [],
  stepIssue:id => S && S.draft ? stepIssue(id, S.draft) : '',
  t:{act, endTurn, fight:def => { S.node = def.node || S.node; startCombat(def); save(); renderAll(); if (S.combat && S.combat.phase === 'enemy') enemyPhase(); }, enemyPhase}};
})();
</script>

</body>
</html>
