function parseJSON(t){
  t = String(t).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return null;
}
async function gemini(system, user, opts){
  opts = opts || {};
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(aiModel())}:generateContent`;
  const max = opts.max || 2000;
  const contents = [{role:'user', parts:[{text:user}]}];
  const bodies = [
    {systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{responseMimeType:'application/json', maxOutputTokens:max, thinkingConfig:{thinkingLevel:'low'}}},
    {systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{responseMimeType:'application/json', maxOutputTokens:max}},
    {contents:[{role:'user', parts:[{text:system + '\n\n' + user}]}]}
  ];
  let lastMsg = '';
  for (let i = 0; i < bodies.length; i++){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    let res;
    try {
      res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':AI.key.trim()}, body:JSON.stringify(bodies[i]), signal:ctl.signal});
    } catch (e) {
      clearTimeout(timer);
      throw new AIError(e && e.name === 'AbortError' ? 'Gemini took too long to answer.' : 'Couldn’t reach Gemini. Check your connection.');
    }
    clearTimeout(timer);
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok){
      const msg = (data && data.error && data.error.message) || res.statusText || ('HTTP ' + res.status);
      if (/api key/i.test(msg) || res.status === 401 || res.status === 403) throw new AIError('Gemini rejected the API key. Check it in AI settings.');
      if (res.status === 404) throw new AIError(`The model “${aiModel()}” wasn’t found. Pick another in AI settings.`);
      if (res.status === 429) throw new AIError('Gemini’s rate limit was hit. Wait a moment, then try again.');
      if (res.status === 400 && i < bodies.length - 1){ lastMsg = msg; continue; }
      throw new AIError('Gemini error: ' + String(msg).slice(0, 140));
    }
    const cand = data && data.candidates && data.candidates[0];
    const parts = (cand && cand.content && cand.content.parts) || [];
    const text = parts.filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
    if (!text){
      const why = (data && data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || 'an empty reply';
      throw new AIError(`Gemini sent back no story (${String(why).toLowerCase()}). Try again or rephrase.`);
    }
    const obj = parseJSON(text);
    if (!obj || typeof obj !== 'object') throw new AIError('Gemini’s answer couldn’t be read. Try again.');
    return obj;
  }
  throw new AIError('Gemini error: ' + String(lastMsg).slice(0, 140));
}

/* ---------- sanitising what comes back ---------- */
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
function cleanText(s, n){ return typeof s === 'string' ? s.replace(/\s+/g, ' ').trim().slice(0, n || 420) : ''; }
function cleanCheck(c){
  if (!c || typeof c !== 'object') return null;
  let raw = String(c.skill || c.ability || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  const dc = clamp(Math.round(+c.dc) || 12, 5, 20);
  const save = /\bsav(e|ing)\b/.test(raw);
  raw = raw.replace(/\b(saving throw|saving|save|check)\b/g, '').replace(/\s+/g, ' ').trim();
  const alias = {'sleight of hand':'sleight', 'animal handling':'animal'};
  if (alias[raw]) raw = alias[raw];
  if (SKILLS[raw] && !save) return {skill:raw, dc};
  const sk = Object.keys(SKILLS).find(k => SKILLS[k][1].toLowerCase() === raw);
  if (sk && !save) return {skill:sk, dc};
  const ab = ABIL.find(a => a.toLowerCase() === raw || ABIL_NAME[a].toLowerCase() === raw);
  if (ab) return save ? {save:ab, dc} : {abil:ab, dc};
  return {abil:'WIS', dc};
}
function cleanEffects(arr, branch){
  if (!Array.isArray(arr)) return [];
  const out = [];
  for (const e of arr.slice(0, 4)){
    if (!e || typeof e !== 'object') continue;
    const t = String(e.type || '').toLowerCase();
    if (t === 'hp'){ const a = clamp(Math.round(+e.amount) || 0, -6, 6); if (a) out.push({type:'hp', amount:a}); }
    else if (t === 'gold'){ const a = clamp(Math.round(+e.amount) || 0, -30, 20); if (a) out.push({type:'gold', amount:a}); }
    else if (t === 'item'){ const it = String(e.item || '').toLowerCase(); const k = /holy/.test(it) ? 'holy' : /potion|draught|heal|tonic/.test(it) ? 'potion' : null; if (k) out.push({type:'item', item:k}); }
    else if (t === 'reveal'){ if (branch === 'success') out.push({type:'reveal', secret:String(e.secret || '').toLowerCase()}); }
    else if (t === 'fight'){ const f = (Array.isArray(e.foes) ? e.foes : [e.foes]).map(x => String(x || '').toLowerCase()).filter(Boolean).slice(0, 2); if (f.length) out.push({type:'fight', foes:f}); }
    else if (t === 'move'){ if (branch !== 'failure'){ const o = Math.round(+e.option); if (Number.isInteger(o)) out.push({type:'move', option:o}); } }
  }
  return out;
}
function cleanBranch(b, kind){ b = b || {}; return {narration:cleanText(b.narration), effects:cleanEffects(b.effects, kind)}; }
function sanitizeInterpret(o, nOpts){
  let intent = String(o.intent || '').toLowerCase();
  if (!['option', 'check', 'auto', 'refuse'].includes(intent)) intent = 'auto';
  const r = {intent, narration:cleanText(o.narration)};
  if (intent === 'option'){
    const i = Math.round(+o.option);
    if (Number.isInteger(i) && i >= 0 && i < nOpts) r.option = i; else r.intent = 'auto';
  }
  if (r.intent === 'check'){
    r.check = cleanCheck(o.check) || {abil:'WIS', dc:12};
    r.success = cleanBranch(o.success, 'success'); r.failure = cleanBranch(o.failure, 'failure');
    if (!r.success.narration) r.success.narration = 'It goes your way.';
    if (!r.failure.narration) r.failure.narration = 'It comes to nothing.';
  }
  if (r.intent === 'auto') r.effects = cleanEffects(o.effects, 'auto');
  if ((r.intent === 'auto' || r.intent === 'refuse') && !r.narration) r.narration = 'Nothing much comes of it.';
  return r;
}
function sanitizeEvent(o){
  const opts = (Array.isArray(o.options) ? o.options : []).slice(0, 3).map(x => {
    x = x || {};
    const check = x.check ? cleanCheck(x.check) : null;
    const success = cleanBranch(x.success, check ? 'success' : 'auto');
    return {label:cleanText(x.label, 70), check, success:Object.assign(success, {narration:success.narration || 'It passes without harm.'}), failure:check ? cleanBranch(x.failure, 'failure') : null};
  }).filter(x => x.label);
  if (opts.length < 2) return null;
  opts.forEach(x => { if (x.check && !x.failure.narration) x.failure.narration = 'It comes to nothing.'; });
  return {title:cleanText(o.title, 48) || 'A Strange Moment', text:cleanText(o.narration, 520), options:opts};
}
function sanitizeImprov(o){
  const check = cleanCheck(o.check) || {abil:'DEX', dc:14};
  const s = o.success || {}, f = o.failure || {};
  const effect = ['damage', 'advantage', 'heal', 'none'].includes(s.effect) ? s.effect : 'none';
  let dice = ['1d4', '1d6', '2d6', '2d8'].includes(s.dice) ? s.dice : '1d6';
  const all = !!s.all && effect === 'damage';
  if ((all || effect === 'heal') && (dice === '2d6' || dice === '2d8')) dice = '1d6';
  return {check, setup:cleanText(o.setup, 300),
    success:{narration:cleanText(s.narration) || 'It works.', effect, dice, all},
    failure:{narration:cleanText(f.narration) || 'It doesn’t come off.'}};
}

/* ---------- applying outcomes ---------- */
function applyEffects(list, ctx){
  const pc = S.pc, M = sceneMeta(S.node);
  let terminal = null, gaveItem = false;
  for (const e of list || []){
    if (e.type === 'hp'){
      if (e.amount < 0){ const n = -e.amount; pc.hp = Math.max(1, pc.hp - n); S.stats.taken += n; gain('hurt', `−${n} HP.${pc.hp === 1 ? ' You are hanging on by a thread.' : ''}`); }
      else { const n = healPC(e.amount); if (n) gain('boon', `+${n} HP.`); }
    } else if (e.type === 'gold'){
      if (e.amount > 0){ const n = Math.min(e.amount, Math.max(0, 60 - S.ai.gold)); if (n){ S.ai.gold += n; G.gold(n); } }
      else { const n = Math.min(-e.amount, pc.gold); if (n){ pc.gold -= n; gain('item', `−${n} gold.`); } }
    } else if (e.type === 'item'){
      if (!gaveItem && S.ai.items < 3){ gaveItem = true; S.ai.items++; if (e.item === 'holy') G.holy(1); else G.potion(1); }
    } else if (e.type === 'reveal'){
      if (M.secrets.includes(e.secret) && LORE[e.secret]) G.lore(e.secret, LORE[e.secret]);
    } else if (e.type === 'fight'){
      if (!terminal){ const ok = aiFoesAllowed(); const foes = e.foes.filter(f => ok.includes(f)).slice(0, 2); if (foes.length) terminal = {fight:foes}; }
    } else if (e.type === 'move'){
      if (!terminal && ctx !== 'event'){ const c = choicesFor(NODES[S.node])[e.option]; if (c && (!c.cost || pc.gold >= c.cost)) terminal = {move:c}; }
    }
  }
  return terminal;
}
function resolveOutcome(branch, ctx){
  if (branch && branch.narration) push({t:'p', html:esc(branch.narration), mark:'pil', ai:true});
  if (ctx === 'event') S.event = null;
  finishAI(applyEffects(branch ? branch.effects : [], ctx));
}
function finishAI(term){
  aiMsg = '';
  if (term && term.fight){
    startAIFight(term.fight);
    save(); renderHud(); renderTray(); revealNew();
    if (S.combat && S.combat.phase === 'enemy') enemyPhase();
    return;
  }
  if (term && term.move){
    if (term.move.cost) S.pc.gold -= term.move.cost;
    enterNodeAfterChoice(term.move.go, entering, 0);
    return;
  }
  save(); renderHud(); renderTray(); revealNew();
}
function startAIFight(foes){
  S.flags['aiFight_' + S.node] = true; S.ai.fights++;
  startCombat({enemies:foes, ret:true, fleeDC:12, gold:foes.includes('brawler') ? 4 + d(6) : 0});
}

/* ---------- player-facing AI actions ---------- */
async function freeAction(text){
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 160);
  if (!text || busy || S.pending || S.combat || S.ended) return;
  if (!aiOn()){ openAI(); return; }
  entering = [];
  push({t:'choice', text:`“${text}”`});
  revealNew();
  const list = currentOptions();
  busy = true; aiMsg = ''; thinkingMsg = 'The storyteller considers…'; renderTray();
  let r;
  try { r = sanitizeInterpret(await gemini(sys(), interpretPrompt(text, list)), list.length); }
  catch (e){ busy = false; thinkingMsg = ''; aiMsg = (e && e.message) || 'The storyteller was silent.'; save(); renderTray(); return; }
  busy = false; thinkingMsg = '';
  entering = [];
  const ctx = S.event ? 'event' : 'scene';
  if (r.intent === 'option'){
    if (r.narration) push({t:'p', html:esc(r.narration), mark:'pil', ai:true});
    if (S.event) pickEventOption(r.option, true); else takeChoice(list[r.option], true);
    return;
  }
  if (r.narration) push({t:'p', html:esc(r.narration), mark:'pil', ai:true});
  if (r.intent === 'check'){
    S.pending = {ai:true, label:text, check:r.check, success:r.success, failure:r.failure, ctx};
    save(); renderTray(); revealNew();
    const b = $('#bigdie'); if (b) b.focus({preventScroll:true});
    return;
  }
  if (r.intent === 'refuse'){ save(); renderTray(); revealNew(); return; }
  resolveOutcome({narration:'', effects:r.effects}, ctx);
}
function pickEventOption(i, silent){
  const ev = S.event, o = ev && ev.options[i];
  if (!o || (busy && !silent)) return;
  if (!silent){ entering = []; push({t:'choice', text:o.label}); }
  aiMsg = '';
  if (o.check){
    S.pending = {ai:true, label:o.label, check:o.check, success:o.success, failure:o.failure, ctx:'event'};
    save(); renderTray(); revealNew();
    return;
  }
  resolveOutcome({narration:o.success.narration, effects:o.success.effects.filter(e => e.type !== 'reveal')}, 'event');
}
async function maybeEvent(){
  if (!aiOn() || !S.pc || S.combat || S.pending || S.ended || S.event || busy) return;
  const id = S.node, M = sceneMeta(id);
  if (!M.ev || S.ai.evDone[id] || S.ai.events >= MAX_EVENTS) return;
  S.ai.evDone[id] = true; save();
  if (Math.random() >= (EVENT_P[AI.events] || 0)) return;
  busy = true; thinkingMsg = 'Something stirs…'; renderTray();
  try {
    const ev = sanitizeEvent(await gemini(sys(), eventPrompt(), {max:3000}));
    if (!ev) throw new AIError('');
    busy = false; thinkingMsg = '';
    if (S.node !== id || S.combat || S.pending || S.ended){ renderTray(); return; }
    S.ai.events++; S.ai.evTitles.push(ev.title);
    S.event = ev;
    entering = [];
    push({t:'event', title:ev.title});
    if (ev.text) push({t:'p', html:esc(ev.text), mark:'pil', ai:true});
    save(); renderTray(); revealNew();
  } catch (e) {
    busy = false; thinkingMsg = '';
    if (e && e.message) aiMsg = 'The interlude slipped away: ' + e.message;
    renderTray();
  }
}
async function improviseAction(text){
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 160);
  const cb = S.combat;
  if (!text || busy || !cb || cb.phase !== 'player' || cb.dying) return;
  busy = true; improvising = false; aiMsg = '';
  entering = [];
  push({t:'choice', text:`“${text}”`});
  thinkingMsg = 'The storyteller weighs your move…'; renderTray(); scrollEnd();
  let r;
  try { r = sanitizeImprov(await gemini(sys(), improvPrompt(text))); }
  catch (e){ thinkingMsg = ''; busy = false; aiMsg = ((e && e.message) || 'No answer came.') + ' Your turn isn’t spent.'; save(); renderTray(); return; }
  thinkingMsg = '';
  if (r.setup) push({t:'p', html:esc(r.setup), mark:'pil', ai:true});
  renderTray(); scrollEnd();
  const bonus = checkBonus(r.check), roll = d20(null);
  S.stats.rolls++; if (roll.nat === 20) S.stats.crits++; if (roll.nat === 1) S.stats.fumbles++;
  await spin(roll.nat, roll.nat === 20 ? 'crit' : roll.nat === 1 ? 'fum' : '');
  const total = roll.nat + bonus;
  const ok = roll.nat === 20 || (roll.nat !== 1 && total >= r.check.dc);
  const rc = {label:checkLabel(r.check).replace(/ \(.*\)$/, ''), nat:roll.nat, mod:bonus, total, vs:`DC ${r.check.dc}`, crit:roll.nat === 20, fum:roll.nat === 1};
  if (ok){
    const s = r.success;
    if (s.effect === 'damage'){
      const targets = s.all ? cb.enemies.filter(alive) : [curTarget()].filter(Boolean);
      const n = Math.max(1, rollDice(s.dice, roll.nat === 20));
      clog({roll:rc, text:`${esc(s.narration)} <b class="dmg">${n}</b> damage${s.all ? ' to every foe' : ''}.`});
      targets.forEach(t => hurtEnemy(t, n));
    } else if (s.effect === 'advantage'){
      cb.adv = true; clog({roll:rc, text:`${esc(s.narration)} Your next attack has advantage.`});
    } else if (s.effect === 'heal'){
      const n = healPC(rollDice(s.dice)); clog({roll:rc, text:`${esc(s.narration)} <b class="heal">+${n} HP</b>.`});
    } else clog({roll:rc, text:esc(s.narration)});
  } else clog({roll:rc, text:esc(r.failure.narration)});
  renderHud(); scrollEnd();
  if (allDown()){ await victory(); return; }
  if (cb.extra){ cb.extra = 0; busy = false; save(); renderTray(); return; }
  await enemyPhase();
}

async function suggestTruth(){
  const tgt = fieldTarget(), st = $('#truth-status'), btn = $('#truth-ask');
  if (!tgt || !aiOn()) return;
  if (btn) btn.disabled = true;
  if (st){ st.className = 'note'; st.textContent = 'Asking the storyteller…'; }
  try {
    const have = (tgt.truths || []).filter(t => t && t.trim());
    const o = await gemini('You help a player add small details to Hollowmere, a poor fishing village of dark folklore on a black lake where a sunken bell tolls at midnight. Answer only with a JSON object.',
      `Suggest one short, vivid thing that could be true about Hollowmere, its people, its weather or its lake: a custom, a superstition, a landmark, a creature or a habit. Keep it eerie and grounded. Do not mention the abbot, the bell, the drowned chapel, dams, sluice gates or sea caves. Make it different from: ${have.join(' | ') || 'nothing yet'}. Return {"truth": "<one sentence, at most 16 words>"}`, {max:600});
    const t = cleanText(o.truth, 120);
    if (!t) throw new AIError('No idea came back. Try again.');
    const inputs = [...document.querySelectorAll('[data-field^="truths."]')].filter(x => !x.closest('[hidden]'));
    const inp = inputs.find(x => !x.value.trim()) || inputs[inputs.length - 1];
    if (inp){ inp.value = t; inp.dispatchEvent(new Event('input', {bubbles:true})); }
    if (st) st.textContent = '';
  } catch (e) {
    if (st){ st.className = 'note ai-status no'; st.textContent = (e && e.message) || 'No answer came.'; }
  }
  if (btn) btn.disabled = false;
}

      <div class="sh-sec"><h3>${K.name.toUpperCase()} · LEVEL ${pc.level}</h3>
        <div class="abil">${ABIL.map(a => `<div class="ab${a === K.prio[0] ? ' key' : ''}"><span class="n">${a}</span><span class="v">${pc.abil[a]}</span><span class="m">${fmt(mod(pc.abil[a]))}</span></div>`).join('')}</div>
        <p class="note">HP ${pc.hp} of ${pc.maxHp} · AC ${pc.ac} · Proficiency +2</p>
      </div>
      <div class="sh-sec"><h3>Abilities</h3><ul class="feat">
        ${K.feats.map(f => `<li><b>${f[0]}.</b> ${f[1]}</li>`).join('')}
        ${res.join('')}
      </ul></div>
      <div class="sh-sec"><h3>Pack</h3><ul class="feat">
        <li><b>${K.weapon.name}</b> ${fmt(w.toHit)} to hit, ${w.dice}${w.dmgB ? fmt(w.dmgB) : ''} ${w.type}</li>
        <li><b>Healing draughts</b> ${pc.potions} · heal 2d4+2, bonus action</li>
        ${pc.holy ? `<li><b>Holy water</b> ${pc.holy} · 2d6+2 radiant to undead</li>` : ''}
        <li><b>Gold</b> ${pc.gold}</li>
      </ul></div>
      ${pastSheetHTML()}${HOOKS.sheetSections()}
      <div class="sh-sec"><h3>Lore</h3>${S.lore.length ? `<ol class="lore-list">${S.lore.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p class="muted">Nothing learned yet. Ask questions; read what you find.</p>'}</div>
      <div class="sh-sec"><h3>Saving throws</h3><ul class="sk">${saves}</ul></div>
      <div class="sh-sec"><h3>Skills</h3><ul class="sk">${skills}</ul><p class="note">Bold: proficient. ✦ expertise (double proficiency).</p></div>
      <div class="sh-sec"><h3>Settings</h3><div class="ab-tools" style="margin-top:0"><button class="small-btn" id="sh-look" data-act="lookopen">Appearance</button>${HOOKS.sheetButtons()}</div></div>
      <div class="sh-sec" id="sh-danger">${sheetDanger()}</div>
    </div>`;
}
function pastSheetHTML(){
  const pc = S.pc, O = ORIGINS[pc.origin];
  let line = '';
  if (O && pc.origin === 'custom') line = `<li><b>${O.name}.</b> ${pc.backstory ? `Before this, you were ${esc(pc.backstory)}. ` : ''}${pc.extraSkills.length ? `Trained in ${SKILLS[pc.extraSkills[0]][1]}.` : ''}</li>`;
  else if (O) line = `<li><b>${O.name}.</b> ${O.perk}</li>`;
  return `<div class="sh-sec"><h3>Your past</h3><ul class="feat">${line}
    <li><b>Keepsake.</b> ${esc(cap(keepsakeText()))}. When a check fails, hold it close and roll again: ${pc.keep} of ${pc.maxKeep || 1} left until you rest.</li></ul></div>`;
}
function sheetDanger(){
  return confirmNew
    ? `<p class="confirm-q">Start over? This erases the current tale.</p><div class="ab-tools"><button class="small-btn" id="sh-yes" data-act="sheetnewyes">Erase and start over</button><button class="small-btn" id="sh-no" data-act="sheetnewno">Keep playing</button></div>`
    : `<button class="small-btn" id="sh-new" data-act="sheetnew">Start a new tale</button>`;
}
function openSheet(){ if (!S.pc) return; confirmNew = false; renderSheet(); $('#sheet').hidden = false; renderHud(); const c = $('#sheet-close'); if (c) c.focus(); }
function closeSheet(){ $('#sheet').hidden = true; confirmNew = false; renderHud(); const b = $('#sheet-btn'); if (b) b.focus(); }

/* ================= flow ================= */
function toTitle(){ S = Object.assign(newState(), {screen:'title'}); confirmNew = false; renderAll(); }
function startCreate(){ S = newState(); S.screen = 'create'; confirmNew = false; renderAll(); $('#scroll').scrollTop = 0; }
function beginTale(){
  const dr = S.draft;
  const name = (dr.name || '').trim() || 'Wren';
  S.pc = buildPC(name, dr.cls, draftScores(), dr);
  S.world = cleanWorld(dr);
  S.screen = 'play'; S.draft = null;
  renderPage(); renderHud();
  $('#scroll').scrollTop = 0;
  go('start');
}
function resume(saved){
  S = saved; busy = false; confirmNew = false; thinkingMsg = ''; improvising = false; worldEdit = null;
  S.ai = Object.assign(freshAI(), S.ai || {}); S.event = S.event || null;
  upgradeSave(S);
  renderAll();
  const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight;
  if (S.combat && S.combat.phase === 'enemy') enemyPhase();
}
function renderAll(){ renderHud(); renderPage(); renderTray(); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  switch (a){
    case 'new': { const sv = loadSave(); if (sv && sv.screen === 'play' && sv.pc && !sv.ended){ confirmNew = true; renderTray(); } else startCreate(); break; }
    case 'confirmnew': clearSave(); startCreate(); break;
    case 'cancelnew': confirmNew = false; renderTray(); break;
    case 'continue': { const sv = loadSave(); if (sv) resume(sv); break; }
    case 'begin': beginTale(); break;
    case 'rollstats': {
      S.draft.rolled = Array.from({length:6}, () => { const r = [d(6), d(6), d(6), d(6)].sort((x, y) => x - y); return r[1] + r[2] + r[3]; });
      renderDraft(); break;
    }
    case 'stdstats': S.draft.rolled = null; renderDraft(); break;
    case 'choose': choose(+el.dataset.i); break;
    case 'roll': doCheckRoll(); break;
    case 'death': deathSave(); break;
    case 'act': act(el.dataset.id); break;
    case 'target': if (S.combat && !busy){ const i = +el.dataset.i; if (alive(S.combat.enemies[i])){ S.combat.target = i; renderTray(); } } break;
    case 'sheet': $('#sheet').hidden ? openSheet() : closeSheet(); break;
    case 'sheetclose': closeSheet(); break;
    case 'sheetnew': confirmNew = true; $('#sh-danger').innerHTML = sheetDanger(); break;
    case 'sheetnewno': confirmNew = false; $('#sh-danger').innerHTML = sheetDanger(); break;
    case 'sheetnewyes': clearSave(); $('#sheet').hidden = true; startCreate(); break;
    case 'again': clearSave(); startCreate(); break;
    case 'next': S.draft.step = 2; renderPage(); renderTray(); $('#scroll').scrollTop = 0; break;
    case 'back': S.draft.step = 1; renderPage(); renderTray(); $('#scroll').scrollTop = 0; break;
    case 'chip': fillChip(el); break;
    case 'keepyes': keepsakeReroll(); break;
    case 'keepno': acceptFailure(); break;
    case 'lookopen': openLook(); break;
    case 'lookclose': closeLook(); break;
    case 'lookreset': LOOK = sanitizeLook({}); saveLook(); applyLook(); renderLook(); { const r = $('#look-reset'); if (r) r.focus(); } break;
    case 'evopt': pickEventOption(+el.dataset.i, false); break;
    case 'aiopen': openAI(); break;
    case 'aiclose': closeAI(); break;
    case 'aishow': { const k = $('#ai-key'); k.type = k.type === 'password' ? 'text' : 'password'; el.textContent = k.type === 'password' ? 'Show' : 'Hide'; break; }
    case 'aitest': testAI(); break;
    case 'aiclear': AI.key = ''; saveAI(); renderAISettings(); $('#ai-status').textContent = 'Key removed. The game is back to its scripted choices.'; refreshAfterAI(); break;
    case 'improvcancel': improvising = false; renderTray(); break;
    case 'worldopen': openWorld(); break;
    case 'worldclose': closeWorld(); break;
    case 'asktruth': suggestTruth(); break;
    case 'reread': $('#scroll').scrollTo({top:0, behavior: RM ? 'auto' : 'smooth'}); break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'pc-name' && S.draft) S.draft.name = el.value;
  const f = el.dataset && el.dataset.field, tgt = fieldTarget();
  if (f && tgt && el.type !== 'radio') setPath(tgt, f, el.value);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.name === 'cls' && S.draft){ S.draft.cls = el.value; renderDraft(); }
  const f = el.dataset && el.dataset.field, tgt = fieldTarget();
  if (f && tgt) setPath(tgt, f, el.value);
  if (el.name === 'origin'){ const c = $('#custom-past'); if (c) c.hidden = el.value !== 'custom'; }
  if (el.dataset && el.dataset.look) setLook(el.dataset.look, el.type === 'checkbox' ? el.checked : el.value);
  HOOKS.change(ev);
});
document.addEventListener('submit', ev => { ev.preventDefault(); HOOKS.submit(ev.target.id); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (HOOKS.escape()) return;
  if (!$('#look').hidden) closeLook(); else if (!$('#sheet').hidden) closeSheet();
});

applyLook(); watchTone();

function start(data){
  if (data && data.S && data.S.v === 1){ resume(data.S); return; }
  toTitle();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot){ try { window.claude.hot.snapshot(() => ({S})); } catch (e) {} }
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});

window.__hollowmere = {NODES, get state(){ return S; }};
})();
</script>

</body>
</html>
